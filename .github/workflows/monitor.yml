name: Gold risk monitor and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: gold-risk-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect market and news risk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLD_HOLDINGS_GRAMS: ${{ secrets.GOLD_HOLDINGS_GRAMS }}
          GOLD_COST_BASIS_CNY: ${{ secrets.GOLD_COST_BASIS_CNY }}
        run: python app.py --update-web site/data/latest.json --github-issue

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
